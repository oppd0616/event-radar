<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追踪事件簿 · 数据看板</title>
<style>:root{font-family:'Microsoft YaHei',sans-serif;color:#222735;background:#f6f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:1320px;margin:auto;padding:38px 32px}.brand{font-size:13px;color:#536483;letter-spacing:2px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;margin:12px 0}p{color:#727b8d;font-size:13px;line-height:1.8}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #dfe4ef;border-radius:9px;padding:11px 16px;background:white;color:#34425d}button.primary{background:#305ad7;color:white;border-color:#305ad7}button:disabled{opacity:.6;cursor:wait}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}.stat{padding:22px;background:white;border:1px solid #e5e8ef;border-radius:12px}.stat span{font-size:13px;color:#768198}.stat strong{display:block;font-size:34px;margin-top:12px}.tabs{display:flex;gap:8px;margin:22px 0}.active{color:#305ad7;background:#eaf0ff;border-color:#cfdafb}.filters{display:flex;gap:12px;margin:18px 0}input,select{border:1px solid #dfe4ec;border-radius:8px;padding:11px;background:white}input{flex:1;min-width:80px}.table{background:white;border:1px solid #e5e8ef;border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{text-align:left;padding:17px;border-bottom:1px solid #edf0f5;font-size:13px}th{color:#7d879a;font-weight:400;background:#fbfcfe}td:first-child{width:42%;font-weight:500}.pill{padding:4px 9px;border-radius:5px;font-size:12px;background:#eaf4ee;color:#41755c}.pending{background:#fff1d9;color:#91651f}.muted{color:#8992a2}.empty{text-align:center;padding:50px;color:#8992a2}.error{color:#a34242}.hint{font-size:12px;color:#8992a2;margin-top:16px}dialog{border:0;border-radius:14px;max-width:780px;width:90%;padding:28px;max-height:85vh;overflow:auto}dialog::backdrop{background:#15213c66}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f6f8fc;padding:18px;line-height:1.6}.detail{color:#606e83;line-height:1.8}dialog h2{font-size:22px}#close{float:right}@media(max-width:700px){main{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.filters{flex-wrap:wrap}h1{font-size:24px}.tabs{flex-wrap:wrap}}
</style><main><div class="brand">追踪事件簿 / 管理看板</div><header><div><h1>这两天，活动库有什么变化</h1><p id="range">正在读取本地审计记录…</p></div><button class="primary" id="refresh">读取云端最新数据</button></header><div id="notice" role="status"></div><section class="stats" id="stats"></section><nav class="tabs"><button data-tab="fresh" class="active">新增记录</button><button data-tab="updates">已有活动更新</button><button data-tab="all">全部变化</button></nav><div class="filters"><input id="search" placeholder="搜索活动名称或城市" aria-label="搜索活动"><select id="domain" aria-label="领域"><option value="">所有领域</option></select><select id="status" aria-label="状态"><option value="">所有状态</option><option value="published">已发布</option><option value="pending">待核验</option></select><button id="export">导出当前列表</button></div><div class="table"><table><thead><tr><th>活动</th><th>领域 / 城市</th><th>状态</th><th>变化类型</th><th>最后写入时间</th><th></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>没有符合条件的活动</div></div><p class="hint">统计窗口为最近一次云端读取时的近48小时。“更新”表示记录被写入，并不等于活动信息发生了实质变化；当前快照不能还原这两天所有修改前后的差异。待核验记录不属于已发布活动。</p></main><dialog id="detail"><button id="close">关闭</button><h2 id="title"></h2><div class="detail" id="facts"></div><details><summary>查看活动记录字段</summary><pre id="raw"></pre></details></dialog>
<script>
let state=null,tab='fresh',visible=[];const labels={tech:'科技',game:'游戏',academic:'竞赛成长',finance:'财经',ent:'演出',culture:'城市文化',anime:'二次元',sports:'体育',auto:'汽车'};const $=id=>document.getElementById(id);const time=n=>n?new Date(Number(n)).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false}):'—';const cutoff=()=>Date.parse(state.recent.since.replace(' ','T')+'+08:00');
function cell(text,cls){const td=document.createElement('td');td.textContent=text||'—';if(cls)td.className=cls;return td;}
function rows(){const map=new Map(state.records.map(x=>[x._id,x]));for(const e of state.recent.fresh)if(!map.has(e._id))map.set(e._id,{...e,createdAt:Date.parse(e.createdAt.replace(' ','T')+'+08:00'),updatedAt:Date.parse(e.updatedAt.replace(' ','T')+'+08:00')});return [...map.values()];}
function render(){const all=rows(),fresh=all.filter(e=>e.createdAt>=cutoff()),old=all.filter(e=>e.createdAt<cutoff());$('range').textContent=`${state.recent.since} — ${state.recent.until} · 北京时间 · 手动读取快照`;$('stats').replaceChildren();for(const [label,n]of [['新增记录',fresh.length],['新增已发布',fresh.filter(e=>e.status==='published').length],['新增待核验',fresh.filter(e=>e.status==='pending').length],['已有活动更新',old.length]]){const el=document.createElement('div');el.className='stat';const s=document.createElement('span');s.textContent=label;const b=document.createElement('strong');b.textContent=n;el.append(s,b);$('stats').append(el);}const q=$('search').value.toLowerCase();visible=(tab==='fresh'?fresh:tab==='updates'?old:all).filter(e=>(!$('domain').value||e.domain===$('domain').value)&&(!$('status').value||e.status===$('status').value)&&(!q||(e.title+' '+e.city).toLowerCase().includes(q))).sort((a,b)=>b.updatedAt-a.updatedAt);$('rows').replaceChildren();for(const e of visible){const tr=document.createElement('tr');tr.append(cell(e.title),cell((labels[e.domain]||e.domain)+' / '+(e.city||'未确认')));const td=cell('');const tag=document.createElement('span');tag.className='pill'+(e.status==='pending'?' pending':'');tag.textContent=e.status==='published'?'已发布':e.status==='pending'?'待核验':e.status;td.append(tag);tr.append(td,cell(e.createdAt>=cutoff()?'新增':'更新写入'),cell(time(e.updatedAt),'muted'));const action=cell('');const button=document.createElement('button');button.textContent='详情';button.onclick=()=>openDetail(e);action.append(button);tr.append(action);$('rows').append(tr);}$('empty').hidden=visible.length>0;}
function openDetail(e){$('title').textContent=e.title;const facts=[['状态',e.status==='published'?'已发布':'待核验'],['创建时间',time(e.createdAt)],['最后写入',time(e.updatedAt)],['活动开始',time(e.startTime)],['活动结束',time(e.endTime)],['地点',e.participationGuide?.location||e.city||'未确认'],['参与说明',e.participation?.note||e.summary||'暂无说明']];$('facts').replaceChildren();for(const [k,v]of facts){const p=document.createElement('p');p.textContent=k+'：'+v;$('facts').append(p);}$('raw').textContent=JSON.stringify(e,null,2);$('detail').showModal();}
async function load(refresh=false){$('refresh').disabled=true;$('notice').className='';$('notice').textContent=refresh?'正在读取腾讯云数据，请稍候…':'';try{const r=await fetch(refresh?'/api/refresh':'/api/data',{method:refresh?'POST':'GET'});const d=await r.json();if(!r.ok){const error=Error(d.error||'读取失败');error.code=d.code;throw error;}if(!d.recent)throw Error('尚无审计快照，请读取云端数据。');state=d;const selected=$('domain').value;$('domain').replaceChildren(new Option('所有领域',''));for(const k of [...new Set(rows().map(e=>e.domain))].sort())$('domain').add(new Option(labels[k]||k,k));$('domain').value=selected;render();$('notice').className=d.lastError?'error':'';$('notice').textContent=d.lastError?(d.lastError+(d.lastErrorCode?'（错误码：'+d.lastErrorCode+'）':'')):(refresh?'已读取最新数据。':'');}catch(e){$('notice').className='error';$('notice').textContent=e instanceof TypeError?'看板后台连接已中断，请双击桌面“追踪事件簿-数据看板”重新打开。':e.message+(e.code?'（错误码：'+e.code+'）':'');}finally{$('refresh').disabled=false;}}
$('refresh').onclick=()=>load(true);$('close').onclick=()=>$('detail').close();for(const id of ['search','domain','status'])$(id).addEventListener(id==='search'?'input':'change',()=>state&&render());document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(state)render();});$('export').onclick=()=>{if(!state)return;const blob=new Blob([JSON.stringify({since:state.recent.since,until:state.recent.until,records:visible},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='活动库变化.json';a.click();URL.revokeObjectURL(u);};load();
</script></html>
